<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#6366f1"/>

  <!-- Envelope body -->
  <rect x="10" y="20" width="44" height="30" rx="3" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Envelope flap (V shape) -->
  <polyline points="10,20 32,38 54,20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Merge arrows — two small inward arrows at bottom-right corner of envelope suggesting mail merge -->
  <line x1="38" y1="37" x2="46" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="41,44 46,44 46,39" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
